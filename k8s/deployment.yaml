apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: campus-app
  template:
    metadata:
      labels:
        app: campus-app
    spec:
      containers:
        - name: campus-container5
          image: koushick25/agile10:v1
          ports:
            - containerPort: 5005

---
apiVersion: v1
kind: Service
metadata:
  name: campus-service
spec:
  type: NodePort
  selector:
    app: campus-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080